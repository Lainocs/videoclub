<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Videoclub</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="loading-screen">
    <div class="loading-content">
      <div class="loading-title">VIDEOCLUB</div>
      <div class="loading-bar"><div class="loading-bar-fill" id="loading-bar-fill"></div></div>
      <div class="loading-text" id="loading-text">Ouverture du magasin...</div>
    </div>
  </div>

  <canvas id="scene-canvas"></canvas>

  <div id="hint" class="hint">Clique sur un boitier pour le sortir de l'etagere</div>

  <div id="hover-preview" class="hover-preview hidden">
    <div id="hover-title" class="hover-title">Titre</div>
    <div id="hover-year" class="hover-year">2000</div>
  </div>

  <div id="detail-panel" class="detail-panel hidden">
    <div class="detail-content">
      <h2 id="detail-title">Titre</h2>
      <div id="detail-meta" class="detail-meta"></div>
      <p id="detail-overview" class="detail-overview"></p>
      <div class="detail-actions">
        <button id="btn-flip">Retourner</button>
        <button id="btn-validate" class="primary">Valider</button>
        <button id="btn-back">Remettre en rayon</button>
      </div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>

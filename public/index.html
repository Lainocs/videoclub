<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Videoclub</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#0c0b0a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <!-- Chargement -->
  <div id="loader" class="loader">
    <div class="loader-inner">
      <div class="brand brand-lg">Videoclub<span>.</span></div>
      <div class="loader-line"><div id="loader-fill"></div></div>
      <div id="loader-text" class="mono">Ouverture du magasin</div>
    </div>
  </div>

  <!-- HUD -->
  <header class="hud-top">
    <div class="brand">Videoclub<span>.</span></div>
    <div class="hud-top-right">
      <span id="count" class="mono"></span>
      <button id="btn-search" class="chip" title="Rechercher (/)">Rechercher <kbd>/</kbd></button>
      <button id="btn-random" class="chip chip-accent" title="Au hasard (R)">Au hasard</button>
    </div>
  </header>

  <div id="hover" class="hover">
    <div id="hover-title" class="hover-title"></div>
    <div id="hover-meta" class="mono hover-meta"></div>
  </div>

  <nav id="index" class="index"></nav>

  <div id="hint" class="hint mono">Molette ou glisser pour parcourir · Clic pour sortir un film</div>

  <!-- Recherche -->
  <div id="search" class="search hidden">
    <input id="search-input" type="text" placeholder="Un titre, un réalisateur…" autocomplete="off" spellcheck="false" />
    <ul id="search-results"></ul>
  </div>

  <!-- Fiche -->
  <aside id="sheet" class="sheet">
    <div class="sheet-inner">
      <div id="sheet-kicker" class="mono kicker"></div>
      <h1 id="sheet-title"></h1>
      <div id="sheet-original" class="original"></div>
      <dl id="sheet-facts" class="facts"></dl>
      <p id="sheet-overview" class="overview"></p>
      <div class="actions">
        <button id="btn-play" class="btn btn-primary">Ouvrir dans Stremio <kbd>↵</kbd></button>
        <div class="actions-row">
          <button id="btn-flip" class="btn">Retourner <kbd>F</kbd></button>
          <a id="btn-lb" class="btn" target="_blank" rel="noopener">Letterboxd</a>
          <button id="btn-back" class="btn">Ranger <kbd>Esc</kbd></button>
        </div>
      </div>
      <div class="mono drag-hint">Fais glisser le boîtier pour le tourner</div>
    </div>
  </aside>

  <script type="module" src="main.js"></script>
</body>
</html>
